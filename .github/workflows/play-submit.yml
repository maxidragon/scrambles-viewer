name: Build AAB and submit to Google Play

# Manual only — a Play release should never happen as a side effect of pushing a tag.
# Builds whatever version app.json currently holds, which the release workflow keeps in
# sync with the latest tag, and uploads it to the internal track. Promoting from internal
# to closed/open/production testing is done in the Play Console.
on:
  workflow_dispatch:

concurrency:
  group: play-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json points at this path; in CI the key comes from a secret, not from disk.
      - name: Write service account key
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$KEY_JSON" > google-play-service-account.json

      # One command so the build that gets submitted is definitely the one just built.
      - name: Build AAB and submit
        run: |
          eas build --platform android --profile production \
            --auto-submit --non-interactive --wait

      - name: Remove service account key
        if: always()
        run: rm -f google-play-service-account.json
